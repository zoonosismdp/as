<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente Virtual Zoonosis MGP</title>

  <!-- Tailwind & FontAwesome para estética moderna -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="asistentezoo.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { navy: '#1A365D', pink: '#E11D48', sky: '#0284C7', emerald: '#059669' }
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-50 h-[100dvh] flex flex-col items-center justify-center p-0 sm:p-4">

  <!-- Contenedor Principal del Chat -->
  <div
    class="w-full h-full sm:h-[90vh] max-w-md bg-white sm:rounded-[2rem] shadow-2xl flex flex-col overflow-hidden border border-slate-200 relative">

    <!-- Cabecera Premium WhatsApp -->
    <div class="bg-[#075e54] text-white p-4 flex items-center gap-4 shadow-md z-50 shrink-0 relative">
      <div class="relative">
        <div class="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center shadow-inner">
          <i class="fa-brands fa-whatsapp text-3xl text-white"></i>
        </div>
        <div id="avatarStatusDot"
          class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-slate-800 rounded-full"></div>
      </div>
      <div>
        <h1 class="text-lg font-bold leading-tight">Asistente Virtual de Zoonosis</h1>
        <p id="headerStatusText" class="text-xs text-slate-300 font-medium flex items-center gap-1">
          <i class="fa-solid fa-bolt text-yellow-400 text-[10px]"></i> En línea
        </p>
      </div>

    </div>

    <!-- Fondo de WhatsApp -->
    <div
      class="absolute inset-0 bg-[#efeae2] bg-[url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')] bg-repeat z-0 opacity-80">
    </div>

    <!-- Área de Mensajes -->
    <div id="chatBody"
      class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 scroll-smooth z-10 custom-scrollbar pb-6 relative">
      <!-- Los mensajes se inyectan acá -->
    </div>

    <!-- Área de Input Moderna -->
    <div
      class="p-3 bg-white border-t border-slate-100 z-50 shrink-0 shadow-[0_-4px_15px_-3px_rgba(0,0,0,0.05)] relative">
      <div
        class="flex items-end gap-2 bg-slate-100 rounded-3xl p-1.5 border border-slate-200 focus-within:border-sky-400 focus-within:ring-2 focus-within:ring-sky-100 transition-all">
        <textarea id="msgInput" rows="1" placeholder="Escribe tu consulta..."
          class="flex-1 max-h-32 bg-transparent border-none focus:ring-0 resize-none py-3 px-4 text-sm text-slate-700 placeholder-slate-400 font-medium"></textarea>
        <button id="sendBtn"
          class="w-11 h-11 rounded-full bg-[#00a884] text-white flex items-center justify-center shadow-md hover:scale-105 hover:bg-[#008f6f] hover:shadow-lg transition-all flex-shrink-0 mb-0.5 mr-0.5">
          <i class="fa-solid fa-paper-plane text-sm ml-[-2px]"></i>
        </button>
      </div>
    </div>

    <!-- Modal de Mapa -->
    <div id="mapModal"
      class="absolute inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex-col items-center justify-center p-4">
      <div
        class="bg-white w-full h-[80%] rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-[popIn_0.3s_ease-out_forwards]">
        <!-- Header del Modal -->
        <div class="bg-brand-navy text-white px-4 py-3 flex justify-between items-center">
          <div class="font-bold text-sm flex items-center gap-2">
            <i class="fa-solid fa-map-location-dot text-sky-400"></i> <span id="mapModalTitle">Ubicación</span>
          </div>
          <button onclick="closeMapModal()"
            class="w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <!-- Iframe Container -->
        <div class="flex-1 w-full bg-slate-100">
          <iframe id="mapModalIframe" class="w-full h-full border-0" allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="p-3 bg-white border-t border-slate-100 text-center">
          <button onclick="closeMapModal()"
            class="px-6 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold rounded-xl transition">Cerrar
            Mapa</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <!-- Firebase Firestore -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="asistentezoo.js"></script>
</body>

</html>
